name: Docker Publish (GHCR)

# Builds the image and pushes it to ghcr.io/<owner>/<repo> (currently jimmy3vil/homescreen-minus-zero).
#   push to develop         -> :develop  (+ :sha-xxxxxxx)
#   push to rebuild/*        -> :rebuild-<name> (+ :sha-xxxxxxx)
#   tag 1.2.3                -> :1.2.3 and :latest
#   manual run               -> tag of the branch it was run on

on:
  push:
    branches:
      - develop
      - 'rebuild/**'
    tags:
      - '*.*.*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Write VERSION file
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "${GITHUB_REF#refs/tags/}" > VERSION
          else
            echo "${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)" > VERSION
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
